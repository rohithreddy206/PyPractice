<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
    h2 { text-align: center; }
    form, table { margin: 20px auto; }
    form { max-width: 400px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    button { margin: 5px; padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    table { border-collapse: collapse; width: 90%; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #007bff; color: white; text-align: center; }
    .cell-id { text-align: center; }
    .cell-first, .cell-last, .cell-email { text-align: left; }
    .message { margin-top: 15px; padding: 10px; text-align: center; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .error-text { color: #d9534f; font-size: 0.9em; margin-top: 4px; }
    .msg-yellow { background: #fff3cd !important; color: #856404 !important; }
    .msg-red { background: #f8d7da !important; color: #721c24 !important; }
    .btn-details { background:#17a2b8; }
    .btn-details:hover { background:#117488; }
    .btn-subjects { background:#198754; }
    .btn-subjects:hover { background:#12623d; }
    .search-bar { max-width: 900px; margin: 10px auto 0; display:flex; gap:8px; align-items:center; }
    .search-bar input { flex:1; padding:8px 10px; border:1px solid #bbb; border-radius:6px; font-size:14px; }
    .search-bar select { padding:8px 10px; border:1px solid #bbb; border-radius:6px; font-size:14px; }
    .pager { display:flex; gap:8px; align-items:center; justify-content:center; margin:12px auto; }
    .pager button { margin:0; padding:6px 12px; }
    .pager .info { font-size:13px; color:#444; }
    .pager .range { font-size:13px; color:#555; }
    .pager button:disabled {
      background:#cfd6de !important;
      color:#666 !important;
      cursor:not-allowed;
      opacity:0.75;
    }
    .top-actions {
      position:fixed;
      top:12px;
      right:18px;
      z-index:1000;
    }
    .top-actions button {
      margin:0;
      padding:8px 14px;
      background:#dc3545;
      color:#fff;
      border:none;
      border-radius:4px;
      cursor:pointer;
    }
    .top-actions button:hover { background:#b52a36; }
  </style>
</head>
<body>
  <!-- NEW: Top-right logout -->
  <div class="top-actions">
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Student redirect script -->
  <script>
    (function(){
      const role = localStorage.getItem('user_role');
      if(role && role !== 'admin'){
        const sid = localStorage.getItem('student_id');
        if(sid) window.location.replace(`/students/${sid}`);
      }
    })();
  </script>

  <h2>{{ heading }}</h2>

  <!-- NEW Search -->
  <div class="search-bar">
    <input id="studentSearch" type="text" placeholder="Search by first name, last name or email">
    <button id="btnSearch">Search</button>
    <button id="btnClear" style="background:#6c757d;">Clear</button>
    <select id="pageSizeSelect">
      <option value="2">2 / page</option>
      <option value="5">5 / page</option>
      <option value="10">10 / page</option>
      <option value="30">30 / page</option>
    </select>
    <button id="btnExportSelected" style="display:none;background:#198754;">Export Selected</button>
    <button id="btnExportAll" style="display:none;background:#6c757d;">Export All</button>
  </div>

  <form id="studentForm">
    <label for="first_name">First Name:</label>
    <input id="first_name" name="first_name" required pattern="[A-Za-z\s-]{2,50}" title="2-50 letters, spaces or hyphens" autocomplete="off" inputmode="text">
    <div class="error-text" id="first_name_error" aria-live="polite"></div>

    <label for="last_name">Last Name:</label>
    <input id="last_name" name="last_name" required pattern="[A-Za-z\s-]{2,50}" title="2-50 letters, spaces or hyphens" autocomplete="off" inputmode="text">
    <div class="error-text" id="last_name_error" aria-live="polite"></div>

    <label for="phone">Phone Number:</label>
    <input id="phone" name="phone" required inputmode="numeric" maxlength="10" pattern="[5-9][0-9]{9}" title="10 digits, starting with 5-9" autocomplete="off">
    <div class="error-text" id="phone_error" aria-live="polite"></div>

    <label for="birthdate">Birthdate:</label>
    <input type="date" id="birthdate" name="birthdate" required>
    <div class="error-text" id="birthdate_error" aria-live="polite"></div>

    <label>Email:</label>
    <input type="email" id="email" name="email" required autocomplete="off">
    <div class="error-text" id="email_error" aria-live="polite"></div>

    <button type="submit" id="submitBtn">Register</button>
    <button type="button" id="cancelEditBtn" style="display:none; margin-left:8px;">Cancel Edit</button>
  </form>

  <div id="response" class="message" style="display:none;"></div>

  <h2>All Students</h2>
  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="chkAll" /></th>
        <th>Student ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Phone Number</th>
        <th>Date Of Birth</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="studentTableBody"></tbody>
  </table>

  <div class="pager" id="pager" style="display:none;">
    <button id="prevPage" disabled>Prev</button>
    <span class="info" id="pageInfo">Page 1</span>
    <span class="range" id="rangeInfo"></span>
    <button id="nextPage" disabled>Next</button>
  </div>

  <!-- Confirmation modal -->
  <div id="confirmModal" style="display:none; position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.4); align-items:center; justify-content:center;">
    <div style="background:#fff; padding:16px; border-radius:6px; max-width:90%; margin:100px auto; width:320px; text-align:center;">
      <p id="confirmText">Are you sure?</p>
      <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
        <button id="confirmYes" style="background:#d9534f;">Delete</button>
        <button id="confirmNo">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/static/auth.js"></script>
  <script>
    // Fallback legacy token injected from backend (if configured)
    const LEGACY_TOKEN = "{{ security_token or '' }}";

    // Helper for authenticated API requests using the function from auth.js
    async function authFetch(url, options={}) {
      return await authenticatedFetch(url, options);
    }

    // Logout button
    function logout() {
      localStorage.removeItem('jwt_token');
      localStorage.removeItem('student_details');
      localStorage.removeItem('user_role');
      window.location.href = '/login';
    }

    function showAuthError() {
      const box = document.getElementById("response");
      box.style.display = "block";
      box.textContent = "Authentication failed: Invalid or missing token.";
      box.className = "message error";
    }

    function showMessage(msg, colorClass) {
      const box = document.getElementById("response");
      box.style.display = "block";
      box.textContent = msg;
      box.className = "message " + colorClass;
    }

    let editingId = null;
    let searchTerm = "";
    let currentPage = 1;
    let totalPages = 1;
    let pageSize = parseInt(localStorage.getItem('page_size') || '10', 10); // ADDED

    // Initialize dropdown selection
    (function initPageSize(){
      const sel = document.getElementById('pageSizeSelect');
      if(sel){
        if(![5,10,20,50].includes(pageSize)) pageSize = 10;
        sel.value = String(pageSize);
      }
    })();

    // REPLACED: loadStudents now uses filter API with pagination
    async function loadStudents() {
      const params = new URLSearchParams({
        page: currentPage,
        page_size: pageSize
      });
      if (searchTerm.trim() !== "") params.append("q", searchTerm.trim());

      const res = await authFetch(`/api/students?${params.toString()}`); // updated endpoint
      if (!res || res.status === 401) return showAuthError();

      const data = await res.json();
      const students = data.items || [];
      totalPages = data.pages || 1;
      currentPage = data.page || 1;

      const tbody = document.getElementById("studentTableBody");
      tbody.innerHTML = "";
      if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#666;">No students found.</td></tr>`;
      } else {
        students.forEach(s => {
          const row = document.createElement("tr");
          row.dataset.id = s.id;
          row.innerHTML = `
            <td style="text-align:center;"><input type="checkbox" class="rowChk" value="${s.id}"></td>
            <td class="cell-id">${s.id}</td>
            <td class="cell-first">${s.first_name}</td>
            <td class="cell-last">${s.last_name}</td>
            <td class="cell-phone" style="text-align:center;">${s.phone}</td>
            <td class="cell-birth" style="text-align:center;">${s.birthdate}</td>
            <td class="cell-email">${s.email}</td>
            <td style="text-align:center;">
              <button class="btn-edit">Edit</button>
              <button class="btn-delete">Delete</button>
              <button class="btn-details" onclick="openStudentDetails(${s.id})">Details</button>
              <button class="btn-subjects" onclick="openStudentSubjects(${s.id})">Subjects</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      }

      // Bind edit/delete again
      document.querySelectorAll('#studentTableBody .btn-edit').forEach(btn => {
        btn.addEventListener('click', onEditClicked);
      });
      document.querySelectorAll('#studentTableBody .btn-delete').forEach(btn => {
        btn.addEventListener('click', onDeleteClicked);
      });

      // Pagination controls (UPDATED)
      const total = data.total || 0; // new local constant
      const pager = document.getElementById('pager');
      pager.style.display = totalPages > 1 || searchTerm ? 'flex' : 'none';
      document.getElementById('pageInfo').textContent =
        `Page ${currentPage} / ${totalPages} (Total: ${total})`;
      const start = students.length ? ((currentPage - 1) * pageSize) + 1 : 0;
      const end = students.length ? start + students.length - 1 : 0;
      document.getElementById('rangeInfo').textContent =
        students.length ? `Showing ${start}-${end}` : '';
      const prev = document.getElementById('prevPage');
      const next = document.getElementById('nextPage');
      prev.disabled = currentPage === 1;
      next.disabled = (currentPage * pageSize) >= total;  // changed condition
    }

    // Email validation: only lowercase allowed and must be a valid email format
    document.getElementById('email').addEventListener('input', function() {
      const errorEl = document.getElementById('email_error');
      let val = this.value.trim();
      // force lowercase + remove spaces
      if (val !== val.toLowerCase()) {
        val = val.toLowerCase();
        this.value = val;
      }
      // incremental validation:
      if (val.length === 0) {
        errorEl.textContent = '';
        return;
      }
      const hasAt = val.includes('@');
      const domainPart = hasAt ? val.split('@')[1] : '';
      const hasDotAfterAt = domainPart && domainPart.includes('.');
      const fullPattern = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;
      // Only show format error when user has typed something like user@domain.t
      if (hasAt && hasDotAfterAt) {
        if (!fullPattern.test(val)) {
          errorEl.textContent = 'Invalid email format (lowercase only).';
        } else {
          errorEl.textContent = '';
        }
      } else {
        // Don't show premature errors
        errorEl.textContent = '';
      }
    });

    // Enforce only letters, spaces, hyphens in First Name and Last Name fields
    document.getElementById('first_name').addEventListener('input', function() {
      this.value = this.value.replace(/[^A-Za-z\s-]/g, '');
    });
    document.getElementById('last_name').addEventListener('input', function() {
      this.value = this.value.replace(/[^A-Za-z\s-]/g, '');
    });

    // REPLACE old phone input handler with stricter first-digit enforcement
    document.getElementById('phone').addEventListener('input', function() {
      const errEl = document.getElementById('phone_error');
      let raw = this.value.replace(/[^0-9]/g,'');
      if(raw.length === 0){
        errEl.textContent = '';
        this.value = '';
        return;
      }
      // Enforce first digit 5-9
      if(!/[5-9]/.test(raw[0])){
        errEl.textContent = 'First digit must be 5-9';
        // discard invalid first digit
        raw = raw.slice(1);
        if(!raw.length){
          this.value = '';
          return;
        }
        // if new first still invalid after removal keep trimming
        while(raw.length && !/[5-9]/.test(raw[0])){
          raw = raw.slice(1);
        }
        if(!raw.length){
          this.value = '';
          return;
        }
      } else {
        errEl.textContent = '';
      }
      this.value = raw.slice(0,10);
    });

    document.getElementById("studentForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      ['first_name','last_name','phone','birthdate','email'].forEach(id => {
        const el = document.getElementById(id + '_error'); if (el) el.textContent = '';
      });

      const first = document.getElementById("first_name").value.trim();
      const last = document.getElementById("last_name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const birth = document.getElementById("birthdate").value;
      // CHANGED: normalize email to lowercase before validation
      const emailInput = document.getElementById("email");
      emailInput.value = emailInput.value.trim().toLowerCase();
      const email = emailInput.value;

      let hasError = false;
      const nameRe = /^[A-Za-z\s-]{2,50}$/;
      const phoneRe = /^[5-9][0-9]{9}$/;
      const emailPattern = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/;

      if (!nameRe.test(first)) {
        document.getElementById('first_name_error').textContent = 'Enter 2-50 letters, spaces or hyphens';
        hasError = true;
      }
      if (!nameRe.test(last)) {
        document.getElementById('last_name_error').textContent = 'Enter 2-50 letters, spaces or hyphens';
        hasError = true;
      }
      if (!phoneRe.test(phone)) {
        document.getElementById('phone_error').textContent = 'Phone must be 10 digits and start with 5-9';
        hasError = true;
      }
      if (!birth) {
        document.getElementById('birthdate_error').textContent = 'Birthdate is required';
        hasError = true;
      } else {
        const sel = new Date(birth + 'T00:00:00');
        const today = new Date();
        if (sel > today) {
          document.getElementById('birthdate_error').textContent = 'Birthdate cannot be in the future';
          hasError = true;
        }
      }
      if (/[A-Z]/.test(email)) {
        document.getElementById('email_error').textContent = "Only small letters are allowed in email.";
        hasError = true;
      } else if (!emailPattern.test(email)) {
        document.getElementById('email_error').textContent = "Please enter a valid email address (only small letters).";
        hasError = true;
      }

      if (hasError) {
        showMessage('Please fix the highlighted fields.', 'error');
        return;
      }

      const formData = { first_name: first, last_name: last, phone: phone, birthdate: birth, email };

      const hasToken = !!localStorage.getItem('jwt_token');  // NEW
      let res, result;
      if (editingId) {
        res = await authFetch(`/api/students/${editingId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        if (!res || res.status === 401) return showAuthError();
        result = await res.json();
        if (result.success) {
          showMessage("Student updated successfully.", "msg-yellow");
          editingId = null;
          document.getElementById('submitBtn').textContent = 'Register';
          document.getElementById('cancelEditBtn').style.display = 'none';
          this.reset();
          loadStudents();
        } else {
          showMessage(result.message || result.errors, "error");
        }
      } else {
        // NEW: choose fetch method based on token presence
        if (hasToken) {
          res = await authFetch("/api/students", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
          });
        } else {
          // Open self-registration without Authorization header
          res = await fetch("/api/students", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
          });
        }
        if (!res) return;
        result = await res.json().catch(()=>({}));
        if (res.ok && result.success) {
          showMessage("Student registered successfully. You can now log in.", "success");
          this.reset();
          if (hasToken) loadStudents(); // only reload list if admin is logged in
        } else {
          showMessage((result && (result.detail || result.message || result.errors)) || "Registration failed", "error");
        }
      }
    });

    let deleteTargetId = null;
    function onDeleteClicked(e) {
      const row = e.target.closest('tr');
      deleteTargetId = row.dataset.id;
      document.getElementById('confirmText').textContent = `Delete student ${deleteTargetId}?`;
      document.getElementById('confirmModal').style.display = 'flex';
    }

    document.getElementById('confirmNo').addEventListener('click', () => {
      deleteTargetId = null; document.getElementById('confirmModal').style.display = 'none';
    });
    document.getElementById('confirmYes').addEventListener('click', async () => {
      if (!deleteTargetId) return;
      const res = await authFetch(`/api/students/${deleteTargetId}`, { method: 'DELETE' });
      if (!res || res.status === 401) return showAuthError();
      const result = await res.json();
      if (result.success) {
        // NEW: clear edit mode if the deleted row was being edited
        if (editingId && String(editingId) === String(deleteTargetId)) {
          editingId = null;
          document.getElementById('studentForm').reset();
          document.getElementById('submitBtn').textContent = 'Register';
          document.getElementById('cancelEditBtn').style.display = 'none';
        }
        showMessage("Student deleted successfully.", "msg-red");
      } else {
        showMessage(result.message || result.errors, "error");
      }
      deleteTargetId = null; document.getElementById('confirmModal').style.display = 'none';
      loadStudents();
    });

    (function(){
      const birth = document.getElementById('birthdate');
      const birthErr = document.getElementById('birthdate_error');
      if (birth) {
        const today = new Date().toISOString().split('T')[0];
        birth.setAttribute('max', today);
        birth.addEventListener('input', () => {
          const v = birth.value;
          if (!v) {
            birthErr.textContent = '';
            return;
          }
          const sel = new Date(v + 'T00:00:00');
          const today = new Date();
          if (sel > today) {
            birthErr.textContent = 'Birthdate cannot be in the future';
          } else {
            birthErr.textContent = '';
          }
        });
      }
    })();

    // NEW: search handlers
    document.getElementById('btnSearch').addEventListener('click', () => {
      searchTerm = document.getElementById('studentSearch').value;
      currentPage = 1;
      loadStudents();
    });
    document.getElementById('btnClear').addEventListener('click', () => {
      document.getElementById('studentSearch').value = '';
      searchTerm = "";
      currentPage = 1;
      loadStudents();
    });
    document.getElementById('studentSearch').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchTerm = e.target.value;
        currentPage = 1;
        loadStudents();
      }
    });

    // NEW: pagination buttons
    document.getElementById('prevPage').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadStudents();
      }
    });
    document.getElementById('nextPage').addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        loadStudents();
      }
    });

    window.onload = loadStudents;

    function onEditClicked(e) {
      const row = e.target.closest('tr');
      const id = row.dataset.id;
      const first = row.querySelector('.cell-first').textContent;
      const last = row.querySelector('.cell-last').textContent;
      const phone = row.querySelector('.cell-phone').textContent;
      const birth = row.querySelector('.cell-birth').textContent;
      const email = row.querySelector('.cell-email').textContent;

      document.getElementById('first_name').value = first;
      document.getElementById('last_name').value = last;
      document.getElementById('phone').value = phone;
      document.getElementById('birthdate').value = birth;
      document.getElementById('email').value = email;

      editingId = id;
      document.getElementById('submitBtn').textContent = 'Save Changes';
      document.getElementById('cancelEditBtn').style.display = 'inline-block';
      document.getElementById('first_name').scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('cancelEditBtn').addEventListener('click', function(){
      editingId = null;
      document.getElementById('studentForm').reset();
      document.getElementById('submitBtn').textContent = 'Register';
      this.style.display = 'none';
    });

    function openStudentDetails(id){
      const role = localStorage.getItem('user_role');
      if(role === 'admin'){
        window.location = `/students/${id}`;
        return;
      }
      localStorage.setItem('pending_student_id', id);
      localStorage.setItem('after_login_target', 'details');
      window.location = '/student-login';
    }
    function openStudentSubjects(id){
      const role = localStorage.getItem('user_role');
      if(role === 'admin'){
        // Admin can directly view subjects page
        window.location = `/students/${id}/subjects`;
        return;
      }
      localStorage.setItem('pending_student_id', id);
      localStorage.setItem('after_login_target', 'subjects');
      window.location = '/student-login';
    }

    // Page size change
    document.getElementById('pageSizeSelect').addEventListener('change', function(){
      pageSize = parseInt(this.value,10);
      localStorage.setItem('page_size', pageSize);
      currentPage = 1;
      loadStudents();
    });

    // Show export buttons only for admin
    (function(){
      const role = localStorage.getItem('user_role');
      if(role === 'admin'){
        document.getElementById('btnExportSelected').style.display='inline-block';
        document.getElementById('btnExportAll').style.display='inline-block';
      }
    })();

    // Master checkbox
    document.getElementById('chkAll').addEventListener('change', function(){
      document.querySelectorAll('.rowChk').forEach(c => c.checked = this.checked);
    });

    async function exportCsv(url, filename){
      const token = localStorage.getItem('jwt_token');
      const headers = {};
      if (token) {
        headers['Authorization'] = 'Bearer ' + token;
      } else if (LEGACY_TOKEN) {
        headers['X-SECURITY-TOKEN'] = LEGACY_TOKEN;
      } else {
        showMessage('Not authenticated (admin export requires login).', 'error');
        return;
      }

      try {
        const res = await fetch(url, { headers });
        if(!res.ok){
          let detailTxt = '';
          try {
            const d = await res.json();
            if (typeof d.detail === 'string') {
              detailTxt = d.detail;
            } else if (d.detail !== undefined) {
              detailTxt = JSON.stringify(d.detail);
            } else {
              detailTxt = JSON.stringify(d);
            }
          } catch {}
            // Trim if huge
          if (detailTxt.length > 180) detailTxt = detailTxt.slice(0,177) + '...';
          console.warn('Export failed', res.status, detailTxt);
          showMessage('Export failed' + (detailTxt ? ' (' + detailTxt + ')' : ''), 'error');
          return;
        }
        const blob = await res.blob();
        if(!blob || blob.size === 0){
          showMessage('Empty export (no data)', 'error');
          return;
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
        showMessage('Export started...', 'success');
      } catch (e){
        console.error('Export exception', e);
        showMessage('Export error (network)', 'error');
      }
    }

    document.getElementById('btnExportSelected').addEventListener('click', () => {
      const ids = Array.from(document.querySelectorAll('.rowChk:checked')).map(c=>c.value);
      if(ids.length === 0){
        showMessage('Select at least one student to export','error');
        return;
      }
      exportCsv(`/api/students/export-all?ids=${ids.join(',')}`, 'students_selected.csv');  <!-- CHANGED -->
    });

    document.getElementById('btnExportAll').addEventListener('click', () => {
      exportCsv('/api/students/export-all', 'students_all.csv');  <!-- CHANGED -->
    });
  </script>
