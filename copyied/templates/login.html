<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Student Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f0f2f5; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .card { background:#fff; padding:32px 28px 28px; border-radius:10px; width:320px; box-shadow:0 4px 16px rgba(0,0,0,0.12); }
    h2 { margin-top:0; text-align:center; font-size:20px; }
    label { font-weight:bold; display:block; margin-top:16px; }
    input { width:100%; padding:10px; margin-top:6px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
    button { width:100%; margin-top:22px; padding:10px; background:#007bff; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:15px; }
    button:hover { background:#0056b3; }
    .msg { margin-top:16px; padding:10px; border-radius:6px; font-size:14px; text-align:center; display:none; }
    .error { background:#f8d7da; color:#721c24; }
    .success { background:#d4edda; color:#155724; }
    .hint { font-size:12px; color:#555; margin-top:8px; text-align:center; }
    a.small { display:block; text-align:center; margin-top:14px; font-size:13px; color:#007bff; text-decoration:none; }
    a.small:hover { text-decoration:underline; }
    .tabs { display:flex; gap:6px; margin-bottom:14px; }
    .tabs button { flex:1; padding:8px 10px; background:#e1e6ef; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
    .tabs button.active { background:#007bff; color:#fff; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Login</h2>
    <div class="tabs">
      <button id="tabAdmin" class="active" onclick="switchMode('admin')">Admin</button>
      <button id="tabStudent" onclick="switchMode('student')">Student</button>
    </div>

    <!-- Admin (username login) -->
    <form id="adminForm">
      <label for="admin_user">Admin Username</label>
      <input id="admin_user" type="text" value="admin" required>
      <label for="admin_pass">Password</label>
      <input id="admin_pass" type="password" required>
      <div class="hint">Default: admin / admin123</div>
      <button type="submit" id="adminLoginBtn">Login as Admin</button>
    </form>

    <!-- Student -->
    <form id="studentForm" class="hidden">
      <label for="student_id_login">Student ID</label>
      <input id="student_id_login" type="number" min="1" required placeholder="e.g. 5">
      <label for="student_pass_login">Password</label>
      <input id="student_pass_login" type="password" required>
      <div class="hint">Password format: first_name + 123 (e.g. John123)</div>
      <button type="submit" id="studentLoginBtn">Login as Student</button>
    </form>

    <button id="logoutBtn" style="display:none;margin-top:12px;background:#dc3545;">Logout</button>
    <div id="msg" class="msg"></div>
  </div>

  <script>
function switchMode(m){
  document.getElementById('tabAdmin').classList.toggle('active', m==='admin');
  document.getElementById('tabStudent').classList.toggle('active', m==='student');
  document.getElementById('adminForm').classList.toggle('hidden', m!=='admin');
  document.getElementById('studentForm').classList.toggle('hidden', m!=='student');
  document.getElementById('msg').style.display='none';
}
function showMsg(t, ok=false){
  const m=document.getElementById('msg');
  m.textContent=t;
  m.className='msg '+(ok?'success':'error');
  m.style.display='block';
}
function storeSession(token, role, sid){
  localStorage.setItem('jwt_token', token);
  localStorage.setItem('user_role', role);
  if(sid) localStorage.setItem('student_id', sid);
}
function afterLogin(role, sid){
  if(role==='admin'){
    window.location.replace('/');
  } else {
    window.location.replace(`/students/${sid}`);
  }
}
const LOGIN_MAX_ATTEMPTS = 3;
const ADMIN_LOCK_KEY = 'admin_login_lock';
const STUD_LOCK_KEY  = 'student_tab_login_lock';

function startLockCountdown(lockKey, seconds, btn, msgEl){
  const until = Date.now() + seconds*1000;
  localStorage.setItem(lockKey, until);
  if (btn) btn.disabled = true;
  function tick(){
    const remain = until - Date.now();
    if (remain <= 0){
      localStorage.removeItem(lockKey);
      if (btn) btn.disabled = false;
      if (msgEl){
        showMsg('You can try again now.', true);
      }
      return;
    }
    const s = Math.ceil(remain/1000);
    if (msgEl){
      showMsg(`Too many failed attempts. Wait ${s}s`, false);
    }
    setTimeout(tick, 1000);
  }
  tick();
}
function restoreLock(lockKey, btn, msgEl){
  const untilStr = localStorage.getItem(lockKey);
  if(!untilStr) return;
  const until = parseInt(untilStr,10);
  if(isNaN(until) || until <= Date.now()){
    localStorage.removeItem(lockKey);
    return;
  }
  const remain = Math.ceil((until - Date.now())/1000);
  startLockCountdown(lockKey, remain, btn, msgEl);
}

async function doStudentLogin(student_id, password){
  const res = await fetch('/api/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({student_id, password})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    if (data.locked){
      startLockCountdown(STUD_LOCK_KEY, data.retry_after_seconds || 60,
        document.getElementById('studentLoginBtn'),
        document.getElementById('msg'));
    } else {
      const used = data.attempts_used ?? 0;
      const left = data.attempts_remaining ?? (LOGIN_MAX_ATTEMPTS - used);
      showMsg((data.detail || 'Login failed')+` (${used}/${LOGIN_MAX_ATTEMPTS} used, ${left} left)`);
    }
    throw new Error(data.detail || 'Login failed');
  }
  return data;
}
async function doAdminLogin(username, password){
  const res = await fetch('/api/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username, password})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    if (data.locked){
      startLockCountdown(ADMIN_LOCK_KEY, data.retry_after_seconds || 60,
        document.getElementById('adminLoginBtn'),
        document.getElementById('msg'));
    } else {
      const used = data.attempts_used ?? 0;
      const left = data.attempts_remaining ?? (LOGIN_MAX_ATTEMPTS - used);
      showMsg((data.detail || 'Login failed')+` (${used}/${LOGIN_MAX_ATTEMPTS} used, ${left} left)`);
    }
    throw new Error(data.detail || 'Login failed');
  }
  return data;
}

restoreLock(ADMIN_LOCK_KEY, document.getElementById('adminLoginBtn'), document.getElementById('msg'));
restoreLock(STUD_LOCK_KEY, document.getElementById('studentLoginBtn'), document.getElementById('msg'));

document.getElementById('adminForm').addEventListener('submit', async e=>{
  e.preventDefault();
  if (document.getElementById('adminLoginBtn').disabled) return;
  try{
    const d = await doAdminLogin(
      document.getElementById('admin_user').value.trim(),
      document.getElementById('admin_pass').value
    );
    storeSession(d.access_token, d.role, d.student_id);
    showMsg('Admin login success. Redirecting...', true);
    setTimeout(()=>afterLogin(d.role, d.student_id), 500);
  }catch(_){}
});
document.getElementById('studentForm').addEventListener('submit', async e=>{
  e.preventDefault();
  if (document.getElementById('studentLoginBtn').disabled) return;
  try{
    const d = await doStudentLogin(
      parseInt(document.getElementById('student_id_login').value,10),
      document.getElementById('student_pass_login').value
    );
    storeSession(d.access_token, d.role, d.student_id);
    showMsg('Student login success. Redirecting...', true);
    setTimeout(()=>afterLogin(d.role, d.student_id), 500);
  }catch(_){}
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem('jwt_token');
  localStorage.removeItem('user_role');
  localStorage.removeItem('student_id');
  location.reload();
});
(function init(){
  if(localStorage.getItem('jwt_token')){
    document.getElementById('logoutBtn').style.display='block';
  }
})();
  </script>
</body>
</html>
