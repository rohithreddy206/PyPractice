<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Login</title>
<style>
  body { font-family:Arial,sans-serif; background:#f0f2f5; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#fff; padding:34px 30px 28px; border-radius:12px; width:330px; box-shadow:0 4px 16px rgba(0,0,0,.12); }
  h2 { margin:0 0 8px; text-align:center; }
  p.sub { margin:0 0 18px; text-align:center; font-size:13px; color:#555; }
  label { font-weight:600; display:block; margin-top:14px; font-size:13px; }
  input { width:100%; padding:10px; margin-top:6px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
  button { width:100%; margin-top:20px; padding:11px; background:#007bff; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:15px; font-weight:600; }
  button:hover { background:#005ec8; }
  .msg { margin-top:16px; padding:10px; border-radius:6px; font-size:14px; text-align:center; display:none; }
  .error { background:#f8d7da; color:#842029; }
  .success { background:#d4edda; color:#155724; }
  a.link { display:block; margin-top:14px; text-align:center; font-size:13px; color:#007bff; text-decoration:none; }
  a.link:hover { text-decoration:underline; }
  .hint { font-size:11px; color:#666; margin-top:6px; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <h2>Student Login</h2>
    <p class="sub">Enter your Student ID & password.</p>
    <form id="studentLoginForm">
      <label for="student_id">Student ID</label>
      <input id="student_id" type="number" min="1" required placeholder="e.g. 5">
      <label for="student_password">Password</label>
      <input id="student_password" type="password" required>
      <div class="hint">Password = first_name + 123 (case sensitive)</div>
      <button type="submit">Login</button>
    </form>
    <div id="studentMsg" class="msg"></div>
    <a class="link" href="/login">Unified login (Admin / Student)</a>
  </div>
  <script src="/static/auth.js"></script>
</body>
</html>
